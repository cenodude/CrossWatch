name: dev-db-image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Dev version bump from the newest release tag"
        type: choice
        options: [patch, minor, major]
        default: patch

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crosswatch-dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check branch
        if: github.ref_name != 'dev-db'
        run: |
          echo "Run this from the dev-db branch, got ${{ github.ref_name }}"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve dev version
        id: ver
        env:
          IN_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          echo "Newest tag: ${last:-none}"

          base="${last#v}"
          base="${base:-0.0.0}"
          IFS=. read -r major minor patch <<< "${base}"

          case "${IN_BUMP}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown bump ${IN_BUMP}"
              exit 1
              ;;
          esac

          version="v${major}.${minor}.${patch}-dev"

          echo "Building ${version} from ${last:-no release tag}"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev-db
            type=sha,prefix=dev-db-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Built ${{ steps.ver.outputs.app_version }}"
            echo
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:dev-db"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"