name: ghcr-pulls-badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Sum GHCR pulls
        shell: python
        run: |
          import json, os, urllib.request

          base = "https://ghcr-badge.elias.eu.org/api/cenodude/CrossWatch/"
          total = 0
          for pkg in ("crosswatch", "crosswatch-dev"):
              req = urllib.request.Request(base + pkg, headers={"User-Agent": "CrossWatch-badge"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              if not data.get("success"):
                  raise SystemExit(f"{pkg}: {data}")
              total += int(data["downloadCountRaw"])

          if total >= 1_000_000:
              message = f"{total / 1_000_000:.1f}M"
          elif total >= 1_000:
              message = f"{total / 1_000:.1f}K"
          else:
              message = str(total)

          os.makedirs("out", exist_ok=True)
          with open("out/ghcr-pulls.json", "w") as f:
              json.dump({
                  "schemaVersion": 1,
                  "label": "GHCR Pulls",
                  "message": message,
                  "color": "blue",
                  "namedLogo": "github",
              }, f)
          print(total, message)

      - name: Publish to badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghcr-pulls.json
          git commit -q -m "Update GHCR pulls badge"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
